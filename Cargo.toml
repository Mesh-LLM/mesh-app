[package]
name = "mesh-tray"
version = "0.1.0"
edition = "2021"

[dependencies]
# Immutable upstream revision; no dependency on another local checkout.
mesh-llm-identity = { git = "https://github.com/Mesh-LLM/mesh-llm", rev = "c025263e40bb7fe66b0bbc53bec80ef23f302bd2", features = ["host-io"] }
ed25519-dalek = "=3.0.0"
crypto_box = "0.9"
tray-icon = "0.21"
muda = "0.17"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false }
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
tempfile = "3"
fs2 = "0.4"
rfd = "0.16"

[target.'cfg(not(target_os = "linux"))'.dependencies]
winit = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
zbus = { version = "4", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[profile.release]
strip = true
