[package]
name = "mesh-tray"
version = "0.1.0"
edition = "2021"

[dependencies]
# Immutable upstream revision; no dependency on another local checkout.
mesh-llm-identity = { git = "https://github.com/Mesh-LLM/mesh-llm", rev = "5b2f3dac7ad9b5e5e8c3227c9756880d50acb909", features = ["host-io"] }
mesh-llm-sdk = { git = "https://github.com/Mesh-LLM/mesh-llm", rev = "5b2f3dac7ad9b5e5e8c3227c9756880d50acb909", default-features = false, features = ["serving", "console", "payments"] }
mesh-llm-host-runtime = { git = "https://github.com/Mesh-LLM/mesh-llm", rev = "5b2f3dac7ad9b5e5e8c3227c9756880d50acb909", default-features = false, features = ["wallet-lexe"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tray-icon = "0.21"
muda = "0.17"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
ureq = { version = "2", default-features = false }
tempfile = "3"
fs2 = "0.4"
rfd = "0.16"
qrcode = { version = "0.14", default-features = false }
png = "0.17"

[target.'cfg(not(target_os = "linux"))'.dependencies]
winit = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
zbus = { version = "4", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5"
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[profile.release]
strip = true
