name: Release macOS

# Alternative Mesh app distribution. Signing transforms upstream inputs;
# original archive provenance is retained, runtime hashes are regenerated.
# Packaging is on demand; publishing is explicitly opt-in.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a prerelease on this repository"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos-arm64:
    permissions:
      contents: write # Explicit opt-in release publication below.
    runs-on: macos-15
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require signing credentials
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: test -n "$CERT" && test -n "$PASSWORD" && test -n "$KEY" && test -n "$KEY_ID" && test -n "$ISSUER"

      - name: Resolve versions
        id: meta
        run: |
          set -euo pipefail
          sha="$(python3 scripts/release-inputs.py)"
          app_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-dev.${GITHUB_SHA:0:9}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            app_version="${GITHUB_REF_NAME#v}"
          fi
          {
            echo "engine_commit=$sha"
            echo "app_version=$app_version"
            echo "signed=true"
          } >> "$GITHUB_OUTPUT"

      - name: Check out engine source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Mesh-LLM/mesh-llm
          ref: ${{ steps.meta.outputs.engine_commit }}
          path: engine-src
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install engine UI package manager
        run: |
          set -euo pipefail
          manager="$(node -p 'require("./engine-src/crates/mesh-llm-ui/package.json").packageManager')"
          [[ "$manager" =~ ^pnpm@[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --global "$manager"
          pnpm --version

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build matching Metal runtime
        env:
          ENGINE_COMMIT: ${{ steps.meta.outputs.engine_commit }}
        run: |
          set -euo pipefail
          # Match mesh-llm's setup-macos-lld action and probe before compiling.
          brew install cmake ninja just sccache lld
          lld_bin="$(brew --prefix lld)/bin"
          export PATH="$lld_bin:$PATH"
          cd engine-src
          sccache --version
          scripts/cargo-linker --mesh-probe
          test "$(git rev-parse HEAD)" = "$ENGINE_COMMIT"
          deployment_target="$(cat scripts/lib/macos-deployment-target.txt)"
          echo "MACOSX_DEPLOYMENT_TARGET=$deployment_target" >> "$GITHUB_ENV"
          just release-runtime-build metal
          archive="$PWD/dist/native-runtimes/meshllm-native-runtime-darwin-aarch64-metal.tar.gz"
          test -f "$archive"
          {
            echo "ENGINE_ARCHIVE=$archive"
            echo "ENGINE_SHA256=$(shasum -a 256 "$archive" | awk '{print $1}')"
          } >> "$GITHUB_ENV"

      - name: Build tray
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py'
          just verify
          just build
          test -z "$(git diff -- Cargo.toml Cargo.lock)"
          python3 engine-src/scripts/verify-host-dependencies.py target/release/mesh-tray \
            --format macho --report host-import-policy.json

      - name: Package Mesh.app
        env:
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
          ENGINE_COMMIT: ${{ steps.meta.outputs.engine_commit }}
        run: |
          set -euo pipefail
          python3 scripts/package-app.py target/release/mesh-tray "$ENGINE_ARCHIVE" out \
            --version "$APP_VERSION" --archive-sha256 "$ENGINE_SHA256" --embedded --engine-commit "$ENGINE_COMMIT" \
            --minimum-system-version "$MACOSX_DEPLOYMENT_TARGET"

      - name: Sign
        if: steps.meta.outputs.signed == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_pw="$(uuidgen)"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pw" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$identity"
          app="out/Mesh.app"
          # Inside out: runtime payload first, then the embedded tray/app.
          find "$app/Contents/Resources/engine/native-runtimes" -type f \
            \( -name '*.dylib' -o -perm -u+x \) -print0 2>/dev/null \
            | xargs -0 -n1 codesign --force --timestamp --options runtime --sign "$identity"
          python3 scripts/finalize-app.py out runtime
          codesign --force --timestamp --options runtime \
            --entitlements scripts/entitlements.plist --sign "$identity" "$app"
          codesign --verify --strict --deep "$app"

      - name: Notarize and staple
        if: steps.meta.outputs.signed == 'true'
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent out/Mesh.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple out/Mesh.app
          xcrun stapler validate out/Mesh.app
          spctl --assess --type execute --verbose=2 out/Mesh.app
          python3 scripts/finalize-app.py out final
          rm "$RUNNER_TEMP/notary.p8"

      - name: Verify packaged embedded contract (no launch or credentials)
        run: |
          set -euo pipefail
          python3 scripts/verify-embedded-package.py out
          codesign --verify --strict --deep out/Mesh.app

      - name: Create distributables
        id: dist
        env:
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
          SIGNED: ${{ steps.meta.outputs.signed }}
        run: |
          set -euo pipefail
          suffix=""
          [[ "$SIGNED" == "true" ]] || suffix="-UNSIGNED"
          base="Mesh-${APP_VERSION}-macos-arm64${suffix}"
          mkdir artifacts
          ditto -c -k --keepParent out/Mesh.app "artifacts/${base}.zip"
          mkdir dmg-stage
          ditto out/Mesh.app dmg-stage/Mesh.app
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "Mesh" -srcfolder dmg-stage -ov -format UDZO \
            "artifacts/${base}.dmg"
          tar -czf "artifacts/${base}.upstream-metadata.tar.gz" -C out upstream-metadata
          cp host-import-policy.json "artifacts/${base}.host-import-policy.json"
          cp out/SHA256.json "artifacts/${base}.manifest.json"
          cd artifacts
          for f in "${base}.zip" "${base}.dmg"; do
            shasum -a 256 "$f" > "$f.sha256"
          done
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Sign disk image
        if: steps.meta.outputs.signed == 'true'
        run: |
          set -euo pipefail
          identity="$(security find-identity -v -p codesigning \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          codesign --force --timestamp --sign "$identity" \
            "artifacts/${{ steps.dist.outputs.base }}.dmg"
          cd artifacts
          shasum -a 256 "${{ steps.dist.outputs.base }}.dmg" \
            > "${{ steps.dist.outputs.base }}.dmg.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.dist.outputs.base }}-installer
          path: artifacts/*.dmg
          if-no-files-found: error

      - name: Upload engineering artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.dist.outputs.base }}-engineering
          path: |
            artifacts/*
            !artifacts/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            tag="build-${APP_VERSION}"
            prerelease="--prerelease"
          fi
          engine_note="engine: ${{ steps.meta.outputs.engine_commit }}"
          gh release create "$tag" --target "$GITHUB_SHA" $prerelease \
            --title "Mesh $APP_VERSION (macOS arm64)" \
            --notes "Signed, notarized macOS arm64 build. $engine_note. Download the DMG and drag Mesh into Applications. The .sha256 sidecar verifies the download; engineering metadata is retained in the workflow artifacts." \
            "artifacts/${{ steps.dist.outputs.base }}.dmg" \
            "artifacts/${{ steps.dist.outputs.base }}.dmg.sha256"

      - name: Clean signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
          if [[ -f "$RUNNER_TEMP/build.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain-db"
          fi
