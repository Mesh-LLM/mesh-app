name: Release macOS

# Alternative Mesh app distribution. Signing transforms upstream inputs;
# original archive provenance is retained, runtime hashes are regenerated.
# Branch push is the non-publishing candidate lane until dispatch is on main.
on:
  push:
    branches: [ci/macos-release-pipeline]
  workflow_dispatch:
    inputs:
      engine:
        description: "mesh-llm engine: vX.Y.Z, main, pr/NUMBER, or a 40-char commit SHA"
        required: true
        default: main
      publish:
        description: "Publish a prerelease on this repository"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      ENGINE_REPO: Mesh-LLM/mesh-llm
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require signing credentials
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: test -n "$CERT" && test -n "$PASSWORD" && test -n "$KEY" && test -n "$KEY_ID" && test -n "$ISSUER"

      - name: Resolve versions
        id: meta
        env:
          ENGINE_INPUT: ${{ inputs.engine || 'main' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            app_version="${GITHUB_REF_NAME#v}"
          else
            app_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-dev.${GITHUB_SHA:0:9}"
          fi
          case "$ENGINE_INPUT" in
            v[0-9]*)
              echo "engine_kind=release" >> "$GITHUB_OUTPUT"
              echo "engine_tag=$ENGINE_INPUT" >> "$GITHUB_OUTPUT" ;;
            *)
              if [[ "$ENGINE_INPUT" =~ ^pr/([0-9]+)$ ]]; then
                sha="$(gh api "repos/$ENGINE_REPO/pulls/${BASH_REMATCH[1]}" -q .head.sha)"
              elif [[ "$ENGINE_INPUT" == main || "$ENGINE_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
                sha="$(gh api "repos/$ENGINE_REPO/commits/$ENGINE_INPUT" -q .sha)"
              else
                echo 'Expected version, main, pr/NUMBER, or full SHA' >&2; exit 1
              fi
              [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
              echo "engine_kind=source" >> "$GITHUB_OUTPUT"
              echo "engine_commit=$sha" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "signed=${{ secrets.APPLE_CERTIFICATE_P12 != '' }}" >> "$GITHUB_OUTPUT"

      - name: Download official engine release
        if: steps.meta.outputs.engine_kind == 'release'
        env:
          TAG: ${{ steps.meta.outputs.engine_tag }}
        run: |
          set -euo pipefail
          mkdir engine && cd engine
          gh release download "$TAG" --repo "$ENGINE_REPO" \
            --pattern "mesh-llm-${TAG}-aarch64-apple-darwin.tar.gz*"
          shasum -a 256 -c "mesh-llm-${TAG}-aarch64-apple-darwin.tar.gz.sha256"
          {
            echo "ENGINE_ARCHIVE=$PWD/mesh-llm-${TAG}-aarch64-apple-darwin.tar.gz"
            echo "ENGINE_SHA256=$(awk '{print $1}' ./*.sha256)"
            echo "ENGINE_PROVENANCE=--engine-version ${TAG#v}"
          } >> "$GITHUB_ENV"

      - name: Check out engine source
        if: steps.meta.outputs.engine_kind == 'source'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Mesh-LLM/mesh-llm
          ref: ${{ steps.meta.outputs.engine_commit }}
          path: engine-src
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.meta.outputs.engine_kind == 'source'
        with:
          node-version: 24

      - name: Install engine UI package manager
        if: steps.meta.outputs.engine_kind == 'source'
        run: |
          set -euo pipefail
          manager="$(node -p 'require("./engine-src/crates/mesh-llm-ui/package.json").packageManager')"
          [[ "$manager" =~ ^pnpm@[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --global "$manager"
          pnpm --version

      - name: Build engine from source
        if: steps.meta.outputs.engine_kind == 'source'
        env:
          ENGINE_COMMIT: ${{ steps.meta.outputs.engine_commit }}
        run: |
          set -euo pipefail
          brew install cmake ninja just
          cd engine-src
          engine_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          just release-build
          just release-bundle "v${engine_version}" dist
          archive="$PWD/dist/mesh-llm-v${engine_version}-aarch64-apple-darwin.tar.gz"
          test -f "$archive"
          {
            echo "ENGINE_ARCHIVE=$archive"
            echo "ENGINE_SHA256=$(shasum -a 256 "$archive" | awk '{print $1}')"
            echo "ENGINE_PROVENANCE=--engine-commit $ENGINE_COMMIT"
          } >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build tray
        run: |
          brew install just
          python3 -m unittest discover -s scripts -p 'test_*.py'
          just verify
          just build

      - name: Package Mesh.app
        env:
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
        run: |
          set -euo pipefail
          read -r -a provenance <<< "$ENGINE_PROVENANCE"
          python3 scripts/package-app.py target/release/mesh-tray "$ENGINE_ARCHIVE" out \
            --version "$APP_VERSION" --archive-sha256 "$ENGINE_SHA256" "${provenance[@]}"

      - name: Sign
        if: steps.meta.outputs.signed == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_pw="$(uuidgen)"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pw" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$identity"
          app="out/Mesh.app"
          # Inside out: runtime payload first, then the engine host, then the app.
          find "$app/Contents/Resources/engine/native-runtimes" -type f \
            \( -name '*.dylib' -o -perm -u+x \) -print0 2>/dev/null \
            | xargs -0 -n1 codesign --force --timestamp --options runtime --sign "$identity"
          codesign --force --timestamp --options runtime \
            --entitlements scripts/entitlements.plist --sign "$identity" \
            "$app/Contents/MacOS/mesh-llm"
          python3 scripts/finalize-app.py out runtime
          codesign --force --timestamp --options runtime \
            --entitlements scripts/entitlements.plist --sign "$identity" "$app"
          codesign --verify --strict --deep "$app"

      - name: Notarize and staple
        if: steps.meta.outputs.signed == 'true'
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent out/Mesh.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple out/Mesh.app
          xcrun stapler validate out/Mesh.app
          spctl --assess --type execute --verbose=2 out/Mesh.app
          python3 scripts/finalize-app.py out final
          rm "$RUNNER_TEMP/notary.p8"

      - name: Packaged engine smoke (no user profile)
        env:
          HOME: ${{ runner.temp }}/mesh-smoke-home
          MESH_LLM_NATIVE_RUNTIME_BUNDLE_DIR: ${{ github.workspace }}/out/Mesh.app/Contents/Resources/engine/native-runtimes
          MESH_LLM_NATIVE_RUNTIME_CACHE_DIR: ${{ runner.temp }}/mesh-smoke-cache
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          out/Mesh.app/Contents/MacOS/mesh-llm --log-format json --version
          out/Mesh.app/Contents/MacOS/mesh-llm --log-format json gpus
          codesign --verify --strict --deep out/Mesh.app

      - name: Create distributables
        id: dist
        env:
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
          SIGNED: ${{ steps.meta.outputs.signed }}
        run: |
          set -euo pipefail
          suffix=""
          [[ "$SIGNED" == "true" ]] || suffix="-UNSIGNED"
          base="Mesh-${APP_VERSION}-macos-arm64${suffix}"
          mkdir artifacts
          ditto -c -k --keepParent out/Mesh.app "artifacts/${base}.zip"
          hdiutil create -volname "Mesh" -srcfolder out/Mesh.app -ov -format UDZO \
            "artifacts/${base}.dmg"
          tar -czf "artifacts/${base}.upstream-metadata.tar.gz" -C out upstream-metadata
          cp out/SHA256.json "artifacts/${base}.manifest.json"
          cd artifacts
          for f in "${base}.zip" "${base}.dmg"; do
            shasum -a 256 "$f" > "$f.sha256"
          done
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Sign disk image
        if: steps.meta.outputs.signed == 'true'
        run: |
          set -euo pipefail
          identity="$(security find-identity -v -p codesigning \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          codesign --force --timestamp --sign "$identity" \
            "artifacts/${{ steps.dist.outputs.base }}.dmg"
          shasum -a 256 "artifacts/${{ steps.dist.outputs.base }}.dmg" \
            > "artifacts/${{ steps.dist.outputs.base }}.dmg.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.dist.outputs.base }}
          path: artifacts/*
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            tag="build-${APP_VERSION}"
            prerelease="--prerelease"
          fi
          engine_note="engine: ${{ steps.meta.outputs.engine_tag || steps.meta.outputs.engine_commit }}"
          gh release create "$tag" --target "$GITHUB_SHA" $prerelease \
            --title "Mesh $APP_VERSION (macOS arm64)" \
            --notes "Signed, notarized macOS arm64 build. $engine_note. Verify downloads with the .sha256 sidecars; SHA256.json in the manifest lists every file inside the app." \
            artifacts/*

      - name: Clean signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
          if [[ -f "$RUNNER_TEMP/build.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain-db"
          fi
