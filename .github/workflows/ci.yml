name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - name: Linux native development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo build --locked
      - run: cargo test --locked
      - name: Real engine + Lexe wallet (macOS; creates a throwaway empty wallet, no funds)
        if: runner.os == 'macOS'
        run: cargo test --locked --test isolated_wallet -- --nocapture
        env:
          MESH_TRAY_WALLET_E2E: "1"
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Windows tray executable
        if: runner.os == 'Windows'
        run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: mesh-tray-windows-x86_64
          path: target/release/mesh-tray.exe
